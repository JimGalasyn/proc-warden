name: Publish to PyPI

# Triggers on a published GitHub Release. The version is static (pyproject.toml,
# src/proc_warden/__init__.py, CITATION.cff), so the artifact's version comes from
# the release commit -- it must match the tag. `make-release` in docs/RELEASING.md
# checks that for you.
#
# Auth is OIDC trusted publishing: PyPI verifies a short-lived token minted by
# GitHub for this repo + workflow + environment, so no credential is stored here.
# It is configured on pypi.org as a *pending* publisher, which is the form used
# for a project that does not exist yet -- the first successful run creates it and
# converts the pending publisher into a normal one.
#
# The four values below must match the pending publisher exactly, or the upload
# is rejected: repository JimGalasyn/proc-warden, workflow publish-pypi.yml,
# environment pypi. Renaming any of them means updating it on pypi.org too.

on:
  release:
    types: [published]
  workflow_dispatch:   # to publish an already-tagged version (--ref vX.Y.Z)

permissions:
  contents: read

jobs:
  build:
    # Only ever build from a TAG. A release event is always on a tag; a manual
    # dispatch must pass --ref vX.Y.Z. This stops an accidental dispatch from a
    # branch putting a non-tagged commit on PyPI, which cannot be undone.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Version must match the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "tag=$tag pyproject=$pkg"
          [ "$tag" = "$pkg" ] || { echo "::error::tag v$tag != pyproject version $pkg"; exit 1; }
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')   # defense in depth; mirrors build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # mint the OIDC token PyPI checks; nothing is stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
