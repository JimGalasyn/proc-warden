name: Publish to PyPI

# Triggers on a published GitHub Release. The version is static (pyproject.toml,
# src/proc_warden/__init__.py, CITATION.cff), so the artifact's version comes from
# the release commit -- it must match the tag. `make-release` in docs/RELEASING.md
# checks that for you.
#
# Auth is an API token in the PYPI_API_TOKEN repository secret. PyPI's preferred
# mechanism is OIDC trusted publishing, which stores no credential at all; moving
# to it is a one-time click-through on pypi.org (see docs/RELEASING.md), after
# which the `password:` line below is deleted and `id-token: write` added.

on:
  release:
    types: [published]
  workflow_dispatch:   # to publish an already-tagged version (--ref vX.Y.Z)

permissions:
  contents: read

jobs:
  build:
    # Only ever build from a TAG. A release event is always on a tag; a manual
    # dispatch must pass --ref vX.Y.Z. This stops an accidental dispatch from a
    # branch putting a non-tagged commit on PyPI, which cannot be undone.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Version must match the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "tag=$tag pyproject=$pkg"
          [ "$tag" = "$pkg" ] || { echo "::error::tag v$tag != pyproject version $pkg"; exit 1; }
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')   # defense in depth; mirrors build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
