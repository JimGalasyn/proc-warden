name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The unit half: pure logic, no systemd, every supported interpreter. This is
  # the job that must stay green on any runner.
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Unit tests
        run: pytest tests/test_unit.py -q

  # The integration half: drives a real systemd user manager, because the whole
  # claim of this tool is that the kernel and systemd hold the state. Runs on one
  # interpreter -- it is testing systemd behaviour, not Python version behaviour.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Bring up a systemd user manager
        run: |
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
      - name: Show what we got
        run: |
          echo "uid=$(id -u) XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR"
          systemctl --user is-system-running || true
          systemctl --user show-environment || true
      - name: Full suite, with subprocess coverage
        env:
          # proc runs as a subprocess in these tests; without this the integration
          # coverage is invisible and the number reflects only the unit tests.
          COVERAGE_PROCESS_START: ${{ github.workspace }}/pyproject.toml
          # Fail loudly rather than skip if the step above did not actually work.
          PROC_REQUIRE_SYSTEMD: "1"
        run: pytest tests/ -q --cov=proc_warden --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  # The packaging half: the sdist and wheel must build and pass twine's metadata
  # check on every change, so a release is never the first time we find out.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Both console scripts are installable and runnable
        run: |
          python -m pip install dist/*.whl
          proc --help > /dev/null
          proc-warden --help > /dev/null
